spring:
  application:
    name: triplay
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://223.130.152.102/test_triplay
    username: user
    password: 1234
  jpa:
    show-sql: true
    database: mysql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            redirect-uri: "https://localhost:5173/callback"
            authorization-grant-type: authorization_code
            scope: profile
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
      resource-server:
        jwt:
          header: Authorization
          secret: ${JWT_SECRET}
          access-expiration: 86400000
          refresh-expiration: 10800000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: ${KEY_PASSWORD}
    key-store-type: PKCS12
    key-alias: triplay

app:
  firebase-configuration-file: ./triplayServiceAccountKey.json
  firebase-bucket: ${FIREBASE_STORAGE_BUCKET}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

management:
  metrics:
    enable:
      all: true
    jdbc:
      instrumentation:
        enabled: true # JDBC 계측 활성화
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "*"  # 모든 엔드포인트 노출
    enabled-by-default: true
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

logging:
  level:
    com.noblesse.backend: debug
    com.noblesse.backend.clip: debug
    com.noblesse.backend.file: debug
    com.noblesse.backend.manage.clip: debug

    # Actuator 로깅
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.actuator: DEBUG

    # 메트릭 디버깅을 위한 로깅
    io.micrometer: DEBUG
